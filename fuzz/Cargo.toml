[package]
name = "saxl-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
saxl-core = { path = "../crates/saxl-core" }
saxl-parser = { path = "../crates/saxl-parser" }
saxl-validator = { path = "../crates/saxl-validator" }
serde_json = "1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_validate"
path = "fuzz_targets/parse_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt_roundtrip"
path = "fuzz_targets/fmt_roundtrip.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the main workspace.
[workspace]
