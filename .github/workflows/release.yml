name: Release

# Run by hand from the Actions tab: Release > Run workflow, on main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without the v (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo test --workspace
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The version goes through the environment, never into the script text.
      - run: scripts/release.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
