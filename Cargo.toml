[workspace]
resolver = "3"
members = [
  "crates/saxl-core", "crates/saxl-parser", "crates/saxl-validator",
  "crates/saxl-renderer", "crates/saxl-cli", "playground/wasm", "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zdmwi/saxl"

[workspace.dependencies]
saxl-core      = { path = "crates/saxl-core" }
saxl-parser    = { path = "crates/saxl-parser" }
saxl-validator = { path = "crates/saxl-validator" }
saxl-renderer  = { path = "crates/saxl-renderer" }

logos              = "0.16"
petgraph           = "0.8"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
indexmap           = { version = "2", features = ["serde"] }
thiserror          = "2"
schemars           = "1"
ts-rs              = "12"
miette             = { version = "7", features = ["fancy"] }
clap               = { version = "4", features = ["derive"] }
notify             = "8"
axum               = "0.8"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
wasm-bindgen       = "=0.2.129"
serde-wasm-bindgen = "0.6"
insta              = { version = "1", features = ["json", "glob"] }
assert_cmd         = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
